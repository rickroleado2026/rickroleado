<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>¡¡ Has sido Rickroleado !!</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        .contenedor {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            margin: 0 0 30px 0;
            font-size: clamp(28px, 5vw, 52px);
            color: #000000;
        }

        .video {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            margin: 0 auto 30px auto;
        }

        .video iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .mensaje {
            margin: 0;
            font-size: clamp(20px, 3vw, 30px);
            color: #000000;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>¡¡ Has sido Rickroleado !!</h1>

        <div class="video">
            <iframe
                src="https://www.youtube.com/watch?v=SbYXkOAoZpI&list=RDSbYXkOAoZpI&start_radio=1&loop=1"
                title="Rick Astley - Never Gonna Give You Up"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>
        </div>

        <p class="mensaje">¡Que tengas un excelente día!</p>

    </div>

</body>
</html>
